; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; 注意：当前配置为临时编译测试配置
; 实际硬件：YD-ESP32-S3 Classic V1.0 (ESP32-S3-WROOM-1)
; 待核实的硬件参数见 docs/hardware.md
; ============================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口监控波特率
monitor_speed = 115200

; 编译优化级别
build_flags =
    -O2
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DEVICE_ID=\"smartfan001\"
    ; CORE_DEBUG_LEVEL 由 ESP32 核心库默认处理，如需自定义可取消下面注释
    ; -D CORE_DEBUG_LEVEL=3

; 上传配置
upload_speed = 921600

; 库依赖（按需添加）
lib_deps =
    adafruit/DHT sensor library@^1.4.7
    adafruit/Adafruit Unified Sensor@^1.1.14

; 源码过滤：仅编译 main.cpp，排除测试文件
build_src_filter = +<main.cpp> +<sensors/> +<ai/> +<communication/> +<control/>

; ============================================================
; DHT11 独立测试环境
; 使用方法：pio run -e dht11-test -t upload
; 或修改 VS Code PlatformIO 构建目标为 dht11-test
; ============================================================
[env:dht11-test]
extends = env:esp32-s3-devkitc-1
board = esp32-s3-devkitc-1
build_src_filter = +<test_dht11_main.cpp>
upload_port = COM5
monitor_port = COM5

; ============================================================
; PIR raw signal read test environment
; Uses GPIO5 and only compiles test_pir_main.cpp.
; Do not upload/run until PIR OUT voltage is confirmed <= 3.3V.
; ============================================================
[env:pir-read-test]
extends = env:esp32-s3-devkitc-1
board = esp32-s3-devkitc-1
build_src_filter = +<test_pir_main.cpp>
monitor_speed = 115200

; ============================================================
; MOSFET 独立测试环境
; 使用方法：pio run -e mosfet-standalone-test -t upload
; 串口命令：ON / OFF / STATUS
; 安全特性：启动时默认关闭，5 秒超时自动关闭
; 初始化失败时禁止启动
; ============================================================
[env:mosfet-standalone-test]
extends = env:esp32-s3-devkitc-1
board = esp32-s3-devkitc-1
build_src_filter = +<test_mosfet_standalone.cpp>
monitor_speed = 115200
build_flags =
    -D FAN_CONTROL_PIN=6
    -D ARDUINO_USB_MODE=1
    ; 继承父环境的 ARDUINO_USB_CDC_ON_BOOT=1
    ; 使用 USB 原生 CDC 模式，Serial 映射到 USBSerial
    ; 与 COM6 (VID_303A PID_1001) ESP32-S3 原生 USB-Serial/JTAG 匹配

; ============================================================
; 风扇简单测试环境（独立循环模式）
; 使用方法：pio run -e fan-simple-test -t upload
; 功能：GPIO6 HIGH 3 秒、LOW 3 秒循环，不依赖串口输入
; 安全特性：启动时默认关闭，初始化失败保持关闭
; ============================================================
[env:fan-simple-test]
extends = env:esp32-s3-devkitc-1
board = esp32-s3-devkitc-1
build_src_filter = +<test_fan_simple.cpp>
monitor_speed = 115200
build_flags =
    -D FAN_CONTROL_PIN=6
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; 继承父环境的 ARDUINO_USB_CDC_ON_BOOT=1
    ; 使用 USB 原生 CDC 模式，Serial 映射到 USBSerial
    ; 与 COM6 (VID_303A PID_1001) ESP32-S3 原生 USB-Serial/JTAG 匹配
