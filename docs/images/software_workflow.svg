<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#64748b"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526078}.t{font-size:23px;font-weight:700}.d{font-size:18px;fill:#334155}.step{fill:#fff;stroke:#54749b;stroke-width:2.5;rx:18}.decision{fill:#fffaf0;stroke:#d69e36;stroke-width:2.5}.safe{fill:#f0fdf4;stroke:#39936b;stroke-width:2.5;rx:18}.arr{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1600" height="980" fill="#fff"/><text x="70" y="76" class="h">SmartFan 2.0 — Software &amp; Control Workflow</text><text x="70" y="112" class="sub">Planned workflow • backend / model / firmware are not yet implemented</text>
<rect x="580" y="155" width="440" height="70" class="step"/><text x="800" y="198" text-anchor="middle" class="t">Start • initialize ESP32</text><path d="M800 225 V270" class="arr"/>
<rect x="580" y="280" width="440" height="75" class="step"/><text x="800" y="325" text-anchor="middle" class="t">Read available sensors</text><path d="M800 355 V400" class="arr"/>
<rect x="580" y="410" width="440" height="75" class="step"/><text x="800" y="455" text-anchor="middle" class="t">Validate readings and format data</text><path d="M800 485 V530" class="arr"/>
<rect x="580" y="540" width="440" height="75" class="step"/><text x="800" y="585" text-anchor="middle" class="t">Send data to Python backend</text><path d="M800 615 V660" class="arr"/>
<polygon points="800,665 1000,750 800,835 600,750" class="decision"/><text x="800" y="743" text-anchor="middle" class="t">Backend available?</text><text x="800" y="775" text-anchor="middle" class="d">Wi-Fi / API response</text>
<path d="M600 750 H290 V815" class="arr"/><text x="440" y="730" class="t">No</text>
<rect x="80" y="825" width="420" height="90" class="safe"/><text x="290" y="862" text-anchor="middle" class="t">Local fallback / safe state</text><text x="290" y="890" text-anchor="middle" class="d">Predefined, verified behavior</text>
<path d="M1000 750 H1300 V815" class="arr"/><text x="1120" y="730" class="t">Yes</text>
<rect x="1080" y="825" width="440" height="90" class="step"/><text x="1300" y="862" text-anchor="middle" class="t">Log data • request AI suggestion</text><text x="1300" y="890" text-anchor="middle" class="d">Decision Tree (planned)</text>
<path d="M1300 915 V940 H800 V955" class="arr"/>
<text x="70" y="955" class="sub">Both paths must pass local ESP32 safety checks before any supported output is applied; dashboard records requested vs executed commands.</text></svg>